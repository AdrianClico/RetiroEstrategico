name: Deploy Produccion RetiroEstrategico

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy theme via FTP
        uses: samkirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          protocol: ftps
          local-dir: wp-content/themes/RetiroEstrategico/
          server-dir: public_html/wp-content/themes/RetiroEstrategico/